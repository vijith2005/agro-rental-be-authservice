spring.application.name=UserAuthService

# ===============================
# SERVER CONFIG
# ===============================
server.port=${PORT:8081}

# ===============================
# EUREKA CLIENT CONFIG
# ===============================
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.register-with-eureka=${EUREKA_REGISTER:true}
eureka.client.fetch-registry=${EUREKA_FETCH:true}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

# ===============================
# MYSQL DATABASE CONFIGURATION
# ===============================
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/spring_security_db}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:admin}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# FEIGN CONFIG
# ===============================
feign.circuitbreaker.enabled=true

# ===============================
# JWT CONFIG
# ===============================
app.jwt.secret=${JWT_SECRET:ReplaceWithA256BitSecretKeyForProductionUseOnly123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===============================
# ACTUATOR (OPTIONAL)
# ===============================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework=INFO
logging.level.com.kce=DEBUG